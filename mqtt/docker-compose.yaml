services:
  emqx1:
    image: emqx/emqx
    container_name: emqx1
    restart: always
    environment:
      - "EMQX_NODE_NAME=emqx@node1.emqx.com"
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 5s
      timeout: 25s
      retries: 5
    networks:
      emqx-bridge:
        aliases:
          - node1.emqx.com
    ports:
      - 1883:1883
      - 8083:8083
      - 8084:8084
      - 8883:8883
      - 18083:18083
    volumes:
      - ./data:/opt/emqx/data

networks:
  emqx-bridge:
    driver: bridge
